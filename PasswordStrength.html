<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Checker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 40px 16px;
      color: #1f2937;
    }

    .card {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 1.6rem;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #e2e8f0;
      color: #111827;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      margin-top: 10px;
      font-weight: 600;
    }

    .weak { background: #fee2e2; color: #991b1b; }
    .moderate { background: #fef3c7; color: #92400e; }
    .strong { background: #dcfce7; color: #166534; }

    ul {
      margin-top: 10px;
      padding-left: 20px;
    }

    .hidden {
      display: none;
    }

    .hint {
      color: #6b7280;
      font-size: 0.92rem;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Password Strength Checker</h1>
    <form id="passwordForm">
      <label for="passwordInput">Enter your password</label>
      <input id="passwordInput" type="password" placeholder="Type a password..." />
      <div class="buttons">
        <button class="primary" type="submit">Check</button>
        <button class="secondary" type="button" id="retryBtn">Retry</button>
        <button class="secondary" type="button" id="cancelBtn">Cancel</button>
      </div>
    </form>

    <div id="result" class="hidden">
      <div id="statusBox" class="status"></div>
      <p id="scoreText"></p>
      <div>
        <strong>Suggestions</strong>
        <ul id="tipsList"></ul>
      </div>
    </div>

    <p class="hint">Rules: 8+ characters, uppercase, lowercase, number, special character.</p>
  </div>

  <script>
    const form = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('passwordInput');
    const retryBtn = document.getElementById('retryBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const result = document.getElementById('result');
    const statusBox = document.getElementById('statusBox');
    const scoreText = document.getElementById('scoreText');
    const tipsList = document.getElementById('tipsList');

    function checkPassword(password) {
      let score = 0;
      const tips = [];

      if (password.length >= 8) score += 1;
      else tips.push('Password must be at least 8 characters long.');

      if (/[A-Z]/.test(password)) score += 1;
      else tips.push('Password must contain at least one uppercase letter.');

      if (/[a-z]/.test(password)) score += 1;
      else tips.push('Password must contain at least one lowercase letter.');

      if (/[0-9]/.test(password)) score += 1;
      else tips.push('Password must contain at least one number.');

      if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) score += 1;
      else tips.push('Password must contain at least one special character.');

      return { score, tips };
    }

    function showResult(score, tips) {
      result.classList.remove('hidden');
      tipsList.innerHTML = '';

      let label = 'Weak password';
      let className = 'weak';

      if (score === 5) {
        label = 'Password is strong';
        className = 'strong';
      } else if (score >= 3) {
        label = 'Password is moderate';
        className = 'moderate';
      }

      statusBox.className = `status ${className}`;
      statusBox.textContent = label;
      scoreText.textContent = `Score: ${score}/5`;

      if (tips.length === 0) {
        const li = document.createElement('li');
        li.textContent = 'No suggestions. Great password!';
        tipsList.appendChild(li);
      } else {
        tips.forEach((tip) => {
          const li = document.createElement('li');
          li.textContent = tip;
          tipsList.appendChild(li);
        });
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const password = passwordInput.value;
      const resultData = checkPassword(password);
      showResult(resultData.score, resultData.tips);
    });

    retryBtn.addEventListener('click', () => {
      passwordInput.value = '';
      passwordInput.focus();
      result.classList.add('hidden');
      tipsList.innerHTML = '';
      scoreText.textContent = '';
      statusBox.textContent = '';
      statusBox.className = 'status';
    });

    cancelBtn.addEventListener('click', () => {
      passwordInput.value = '';
      result.classList.add('hidden');
      tipsList.innerHTML = '';
      scoreText.textContent = '';
      statusBox.textContent = 'Cancelled.';
      statusBox.className = 'status weak';
      result.classList.remove('hidden');
    });
  </script>
</body>
</html>
